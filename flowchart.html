<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flowchart Workspace | Line MindMap</title><meta name="description" content="Create medical study flowcharts with labeled connections, editable shapes, local saving, and high-quality PNG, SVG, and PDF exports."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://linemindmap.com/flowchart.html"><link rel="icon" href="/assets/logo-48.png" sizes="48x48"><meta property="og:title" content="Line MindMap — Flowchart Workspace"><meta property="og:type" content="website"><meta property="og:url" content="https://linemindmap.com/flowchart.html"><meta property="og:image" content="https://linemindmap.com/assets/medical-learning-flowchart.png"><meta name="twitter:card" content="summary_large_image"><link rel="stylesheet" href="/assets/flowchart.css"><script src="/assets/flowchart.js" defer></script></head><body>
<header><a href="/" class="brand"><img src="/brand.svg" alt="Line MindMap"><span>LINE MINDMAP<br>FLOWCHART</span></a><input id="title" aria-label="Flowchart title" value="Untitled flowchart" maxlength="120"><nav><a href="/">Mind maps &amp; tables</a><a href="/blog/">Blogs</a><a href="/blog/medical-learning-flowcharts/">Help</a></nav></header>
<div class="toolbar" aria-label="Flowchart tools"><button data-add="terminal">＋ Start / End</button><button data-add="process">＋ Process</button><button data-add="decision">＋ Decision</button><button data-add="io">＋ Input / Output</button><span class="separator"></span><button id="child" title="Tab">＋ Child</button><button id="sibling" title="Ctrl+Enter (or Ctrl+Tab where supported)">＋ Sibling</button><button id="connect" aria-pressed="false">Connect</button><button id="undo" title="Ctrl/Cmd+Z">Undo</button><button id="redo" title="Ctrl/Cmd+Shift+Z">Redo</button><button id="delete">Delete</button><span class="separator"></span><button id="out" aria-label="Zoom out">−</button><span id="zoom">100%</span><button id="in" aria-label="Zoom in">＋</button><button id="fit">Fit</button><select id="direction" aria-label="Diagram direction"><option value="vertical">Top to bottom</option><option value="horizontal">Left to right</option></select><button id="arrange">Arrange</button><select id="routing" aria-label="Connector style"><option value="orthogonal">Straight branches</option><option value="curved">Curved lines</option></select><button id="template">Branching template</button><span class="separator"></span><button id="new">New</button><button id="open">Open JSON</button><input type="file" id="file" accept=".json,application/json" hidden><button id="save">Save JSON</button><select id="format" aria-label="Export format"><option value="png">PNG · high resolution</option><option value="svg">SVG · vector</option><option value="pdf">PDF · print</option></select><button id="export">Export</button></div>
<main id="workspace" aria-label="Flowchart workspace">
<svg id="canvas" tabindex="0" aria-label="Flowchart canvas"><g id="scene"></g></svg>
<div id="shape-context-menu" class="floating-toolbar" hidden role="toolbar" aria-label="Cell formatting">
<button id="context-bold" type="button" title="Bold text" aria-label="Bold text"><strong>B</strong></button>
<span class="tool-divider" aria-hidden="true"></span>
<button id="font-smaller" type="button" title="Decrease text size" aria-label="Decrease text size">A−</button>
<span id="font-size-display" class="font-size-display">18 px</span>
<button id="font-larger" type="button" title="Increase text size" aria-label="Increase text size">A+</button>
<label class="color-tool" title="Cell fill color" aria-label="Cell fill color"><input id="context-color" type="color" value="#eaf6fc" aria-label="Cell fill color"></label>
<span class="tool-divider" aria-hidden="true"></span>
<button id="context-edit" type="button" title="Edit cell text">Edit text</button>
</div>
<div id="cell-editor" hidden role="dialog" aria-label="Edit flowchart text">
<div class="editor-heading"><strong>Edit text</strong><button id="cancel-text-exit" type="button" aria-label="Close editor" title="Cancel">×</button></div>
<textarea id="edit-text" maxlength="600" rows="4" aria-label="Cell or connector text" placeholder="Type your text…"></textarea>
<div class="editor-footer"><span id="editor-hint">Enter to save connector labels · Ctrl+Enter to save cells</span><div class="editor-actions"><button id="cancel-text" type="button">Cancel</button><button id="save-text" type="button">Save</button></div></div>
</div>
</main><div id="status" role="status" aria-live="polite">Ready</div>
</body></html>
