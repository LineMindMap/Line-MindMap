name: Temporary flowchart regression
on:
  push:
    branches:
      - feature/full-canvas-flowchart-workspace
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
